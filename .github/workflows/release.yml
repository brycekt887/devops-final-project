name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      aws_session_token:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.event.inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ github.event.inputs.aws_secret_access_key }}
          aws-session-token: ${{ github.event.inputs.aws_session_token }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./iac
        run: terraform init

      - name: Terraform Plan
        working-directory: ./iac
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./iac
        run: terraform apply --auto-approve

      - name: Get EC2 Public IP
        id: ip
        working-directory: ./iac
        run: |
          echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

      - name: Install SSH Client
        run: sudo apt-get install -y openssh-client

      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy Docker Container to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ steps.ip.outputs.ip }} "
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/final-project:latest &&
            sudo docker stop app || true &&
            sudo docker rm app || true &&
            sudo docker run -d -p 80:80 --name app ${{ secrets.DOCKERHUB_USERNAME }}/final-project:latest
          "
